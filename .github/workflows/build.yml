name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test and build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1

      - name: Test and build (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh
          cd dist
          ditto -c -k --keepParent OdooAutoAttendance.app OdooAutoAttendance-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OdooAutoAttendance-${{ runner.os }}
          path: |
            dist/OdooAutoAttendance.exe
            dist/OdooAutoAttendance-macOS.zip
            install.ps1
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OdooAutoAttendance.exe
            dist/OdooAutoAttendance-macOS.zip
            install.ps1
          fail_on_unmatched_files: false
